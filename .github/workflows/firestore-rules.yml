# פורס את firestore.rules ל־Firebase אוטומטית בכל שינוי בקובץ.
# דורש סוד במאגר בשם FIREBASE_SERVICE_ACCOUNT (מפתח JSON של חשבון שירות עם הרשאת Firebase Rules Admin).
name: Deploy Firestore rules
on:
  push:
    branches: [main]
    paths: [firestore.rules]
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check secret
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$SA" ]; then echo "::warning::FIREBASE_SERVICE_ACCOUNT secret is missing, skipping deploy"; exit 0; fi
          echo "$SA" > "$RUNNER_TEMP/sa.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/sa.json" >> "$GITHUB_ENV"
          echo "DO_DEPLOY=1" >> "$GITHUB_ENV"
      - name: Deploy rules
        if: env.DO_DEPLOY == '1'
        run: |
          printf '{"firestore":{"rules":"firestore.rules"}}' > firebase.json
          npx -y firebase-tools@13.29.1 deploy --only firestore:rules --project inventory-55-2a551 --non-interactive
