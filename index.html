<style>
html,body{margin:0}[hidden]{display:none!important}img{max-width:100%}

/* Layout: same shell as the Seven Collection app — sticky brand header with a menu button, side drawer for pages, one working column. */
:root {
  --bg: #EDF0F4; --surface: #FFFFFF; --sunk: #E2E7EE; --line: #D2D9E3; --fg: #132033; --muted: #566377;
  --accent: #132033; --accent-ink: #FFFFFF; --accent-soft: #E2E7EE;
  --brass: #8A5E0E; --brass-soft: #F2E4C4;
  --good: #1D734A; --good-soft: #DCEFE4; --warn: #A04B17; --warn-soft: #FAE6D4; --crit: #AE2318; --crit-soft: #F9E0DC;
  --scrim: rgb(12 18 28 / .45);
  --font-display: "Suez One", "Frank Ruhl Libre", Georgia, serif;
  --font-body: "IBM Plex Sans Hebrew", "Rubik", "Segoe UI", system-ui, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", monospace;
  --r: 10px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0E131A; --surface: #17202B; --sunk: #111822; --line: #293443; --fg: #E4EAF2; --muted: #97A3B4;
  --accent: #E4EAF2; --accent-ink: #0E131A; --accent-soft: #1E2935; --brass: #E2B65E; --brass-soft: #3A2D14;
  --good: #57C891; --good-soft: #163326; --warn: #F2A267; --warn-soft: #3A2414; --crit: #F2806F; --crit-soft: #3B1A17;
  --scrim: rgb(0 0 0 / .6); color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #0E131A; --surface: #17202B; --sunk: #111822; --line: #293443; --fg: #E4EAF2; --muted: #97A3B4;
  --accent: #E4EAF2; --accent-ink: #0E131A; --accent-soft: #1E2935; --brass: #E2B65E; --brass-soft: #3A2D14;
  --good: #57C891; --good-soft: #163326; --warn: #F2A267; --warn-soft: #3A2414; --crit: #F2806F; --crit-soft: #3B1A17;
  --scrim: rgb(0 0 0 / .6); color-scheme: dark; }

* { box-sizing: border-box; }
body { background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 15px; line-height: 1.5; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); }
.wrap { max-width: 960px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; letter-spacing: .02em; }
.num { font-variant-numeric: tabular-nums; }
h1, h2, h3 { margin: 0; text-wrap: balance; }
button, select, input, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--brass); outline-offset: 2px; }

.ptitle { font-family: var(--font-display); font-weight: 400; font-size: 1.6rem; line-height: 1.2; }
.block > h2 { font-family: var(--font-display); font-weight: 400; font-size: 1.2rem; }
header.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--surface); border-bottom: 1px solid var(--line); }
.top .row1 { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-block: 12px 8px; flex-wrap: wrap; }
.brand { display: flex; align-items: baseline; gap: 10px; }
.brand h1 { font-size: 18px; font-weight: 700; }
.brand .tag { font-size: 12px; color: var(--brass); background: var(--brass-soft); padding: 1px 8px; border-radius: 99px; font-weight: 600; }
.acting { display: flex; align-items: center; gap: 8px; min-width: 0; flex: 1 1 260px; justify-content: flex-end; }
.acting label { font-size: 12px; color: var(--muted); white-space: nowrap; }
.acting select { min-width: 0; flex: 1; max-width: 360px; }
.tabs { display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; padding-bottom: 8px; }
.tabs::-webkit-scrollbar { display: none; }
.top-in { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-block: 12px; }
.brandx { display: flex; align-items: center; gap: 10px; min-width: 0; }
.markx { width: 36px; height: 36px; border-radius: 9px; background: var(--fg); color: var(--brass-soft); display: grid; place-items: center; flex: none; }
.b1 { font-family: var(--font-display); font-size: 1.15rem; line-height: 1.1; }
.b2 { font-size: .82rem; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.burger { width: 42px; height: 42px; border: 0; background: none; color: var(--fg); display: grid; place-items: center; border-radius: 10px; cursor: pointer; flex: none; position: relative; }
.burger:hover { background: var(--sunk); }
.burger .badge { position: absolute; top: 2px; inset-inline-end: 2px; }
.drawer-bg { position: fixed; inset: 0; background: var(--scrim); z-index: 70; }
.drawer { position: fixed; top: 0; bottom: 0; left: 0; width: min(300px, 86vw); background: var(--surface); z-index: 71; display: flex; flex-direction: column; gap: 4px; overflow-y: auto; padding: calc(14px + env(safe-area-inset-top, 0px)) 14px calc(18px + env(safe-area-inset-bottom, 0px)) max(14px, env(safe-area-inset-left, 0px)); box-shadow: 0 0 40px rgb(0 0 0 / .18); }
@media (prefers-reduced-motion: no-preference) { .drawer { animation: drawerIn .22s ease-out; } .drawer-bg { animation: fadeIn .2s; } }
@keyframes drawerIn { from { transform: translateX(-100%); } to { transform: none; } }
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
.drawer-h { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 4px 4px 12px; border-bottom: 1px solid var(--line); margin-bottom: 8px; }
.drawer-h b { font-family: var(--font-display); font-weight: 400; font-size: 1.2rem; }
.drawer-who { font-size: .82rem; color: var(--muted); padding: 0 6px 10px; display: grid; gap: 6px; }
.drawer-who select { width: 100%; }
.navi { display: flex; align-items: center; gap: 12px; width: 100%; padding: 12px; border-radius: 10px; border: 0; background: none; font: inherit; font-size: 1rem; color: var(--fg); cursor: pointer; text-align: start; }
.navi:hover { background: var(--sunk); }
.navi[aria-current="page"] { background: var(--sunk); font-weight: 600; }
.navi svg { color: var(--muted); flex: none; }
.navi .badge { margin-inline-start: auto; }
.xbtn { border: 0; background: var(--sunk); color: var(--fg); width: 32px; height: 32px; border-radius: 8px; font-size: 1.1rem; cursor: pointer; flex: none; }
.tab { border: 0; background: transparent; padding: 7px 12px; border-radius: 8px; color: var(--muted); font-weight: 500; white-space: nowrap; cursor: pointer; display: inline-flex; gap: 6px; align-items: center; }
.tab:hover { background: var(--sunk); color: var(--fg); }
.tab[aria-selected="true"] { background: var(--accent); color: var(--accent-ink); }
.badge { font-size: 11px; min-width: 18px; height: 18px; padding: 0 5px; border-radius: 99px; background: var(--crit); color: #fff; display: inline-grid; place-items: center; font-weight: 600; }
.tab[aria-selected="true"] .badge { background: var(--accent-ink); color: var(--accent); }

main { padding-block: 16px 64px; display: grid; gap: 20px; }
.demo { font-size: 13px; color: var(--muted); border: 1px dashed var(--line); border-radius: var(--r); padding: 8px 12px; }
.scope { color: var(--muted); font-size: 13px; }
.scope b { color: var(--fg); font-weight: 600; }
section.block { display: grid; gap: 10px; min-width: 0; }
.block > h2 { font-size: 16px; font-weight: 600; display: flex; align-items: center; gap: 8px; justify-content: space-between; flex-wrap: wrap; }
.block > h2 small { font-weight: 400; color: var(--muted); font-size: 13px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px; min-width: 0; }
.muted { color: var(--muted); }
.small { font-size: 13px; }

.stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }
@media (max-width: 640px) { .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.stat { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 12px 14px; display: grid; gap: 4px; }
.stat .k { font-size: 12px; color: var(--muted); letter-spacing: .02em; }
.stat .v { font-family: var(--font-mono); font-size: 1.45rem; font-weight: 500; font-variant-numeric: tabular-nums; line-height: 1.15; }
.stat .v small { font-size: 14px; font-weight: 500; color: var(--muted); }
.stat.lead { border-color: var(--accent); }
.meter { height: 6px; background: var(--sunk); border-radius: 99px; overflow: hidden; }
.meter > i { display: block; height: 100%; background: var(--accent); border-radius: 99px; }
.meter.warn > i { background: var(--warn); }
.meter.crit > i { background: var(--crit); }

.tablewrap { overflow-x: auto; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); }
table { border-collapse: collapse; width: 100%; font-size: 14px; }
th, td { text-align: right; padding: 9px 12px; border-bottom: 1px solid var(--line); white-space: nowrap; }
th { font-size: 12px; font-weight: 600; color: var(--muted); background: var(--sunk); }
tr:last-child td { border-bottom: 0; }
td.wrapcell { white-space: normal; min-width: 160px; }
tr.click { cursor: pointer; }
tr.click:hover td { background: var(--sunk); }

.pill { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 600; padding: 2px 9px; border-radius: 99px; white-space: nowrap; background: var(--sunk); color: var(--muted); }
.pill.good { background: var(--good-soft); color: var(--good); }
.pill.warn { background: var(--warn-soft); color: var(--warn); }
.pill.crit { background: var(--crit-soft); color: var(--crit); }
.pill.brass { background: var(--brass-soft); color: var(--brass); }
.pill.acc { background: var(--accent-soft); color: var(--accent); }
.tzno { color: var(--brass); font-weight: 600; }

.list { display: grid; gap: 8px; }
.item { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 12px 14px; display: grid; gap: 8px; min-width: 0; }
.item .head { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; flex-wrap: wrap; }
.item .title { font-weight: 600; }
.item .meta { font-size: 13px; color: var(--muted); }
.item.sev-crit { border-inline-start: 4px solid var(--crit); }
.item.sev-warn { border-inline-start: 4px solid var(--warn); }
.item.sev-good { border-inline-start: 4px solid var(--good); }
.actions { display: flex; gap: 8px; flex-wrap: wrap; }

.btn { border: 1px solid var(--line); background: var(--surface); padding: 7px 14px; border-radius: 8px; cursor: pointer; font-weight: 500; }
.btn:hover { background: var(--sunk); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.primary:hover { filter: brightness(1.08); }
.btn.good { border-color: var(--good); color: var(--good); }
.btn.good.on { background: var(--good); color: #fff; }
.btn.crit { border-color: var(--crit); color: var(--crit); }
.btn.crit.on { background: var(--crit); color: #fff; }
.btn.warn { border-color: var(--warn); color: var(--warn); }
.btn.warn.on { background: var(--warn); color: #fff; }
.btn.sm { padding: 4px 10px; font-size: 13px; }
.btn[disabled] { opacity: .5; cursor: not-allowed; }
.linkbtn { border: 0; background: none; color: var(--accent); cursor: pointer; padding: 0; font-weight: 500; }

select, input[type="text"], input[type="number"], input[type="date"], textarea { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 7px 10px; min-width: 0; }
textarea { width: 100%; resize: vertical; min-height: 64px; }
.field { display: grid; gap: 4px; min-width: 0; }
.field > label, .lbl { font-size: 12px; color: var(--muted); font-weight: 500; }
.formgrid { display: grid; gap: 12px; }
.seg { display: inline-flex; background: var(--sunk); border-radius: 9px; padding: 3px; gap: 2px; flex-wrap: wrap; }
.seg button { border: 0; background: transparent; padding: 5px 12px; border-radius: 7px; cursor: pointer; color: var(--muted); font-weight: 500; }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--fg); box-shadow: 0 1px 2px rgb(0 0 0 / .12); }
.line { display: grid; grid-template-columns: minmax(0, 1fr) 96px auto; gap: 8px; align-items: center; }
.checks { display: grid; gap: 6px; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); }
.check { display: flex; gap: 8px; align-items: center; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; cursor: pointer; background: var(--surface); }
.check:has(input:checked) { border-color: var(--brass); background: var(--brass-soft); }
.toolbar { display: flex; gap: 10px; flex-wrap: wrap; align-items: end; }
.toolbar .field { flex: 1 1 180px; }

.empty { text-align: center; padding: 28px 16px; color: var(--muted); background: var(--surface); border: 1px dashed var(--line); border-radius: var(--r); }
.empty b { color: var(--fg); display: block; margin-bottom: 4px; }

details.sku { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); }
details.sku summary { list-style: none; cursor: pointer; padding: 10px 14px; display: flex; justify-content: space-between; gap: 10px; align-items: center; }
details.sku summary::-webkit-details-marker { display: none; }
details.sku summary::after { content: "›"; color: var(--muted); transform: rotate(90deg); transition: transform .15s; }
details.sku[open] summary::after { transform: rotate(-90deg); }
details.sku .rows { border-top: 1px solid var(--line); padding: 4px 14px 10px; display: grid; }
details.sku .rows div { display: flex; justify-content: space-between; gap: 10px; padding: 5px 0; font-size: 14px; border-bottom: 1px dotted var(--line); }
details.sku .rows div:last-child { border-bottom: 0; }

.sheet-bg { position: fixed; inset: 0; background: rgb(0 0 0 / .45); z-index: 20; display: grid; place-items: end center; }
@media (min-width: 700px) { .sheet-bg { place-items: center; } }
.sheet { background: var(--surface); width: min(640px, 100%); max-height: 88vh; overflow-y: auto; border-radius: 14px 14px 0 0; padding: 18px max(18px, env(safe-area-inset-right, 0px)) calc(18px + env(safe-area-inset-bottom, 0px)) max(18px, env(safe-area-inset-left, 0px)); display: grid; gap: 14px; }
@media (min-width: 700px) { .sheet { border-radius: 14px; } }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 6px 16px; font-size: 14px; }
.kv dt { color: var(--muted); }
.kv dd { margin: 0; }
.timeline { display: grid; gap: 0; border-inline-start: 2px solid var(--line); margin-inline-start: 6px; }
.timeline div { padding: 4px 14px 8px; position: relative; font-size: 14px; }
.timeline div::before { content: ""; position: absolute; inset-inline-start: -6px; top: 10px; width: 10px; height: 10px; border-radius: 50%; background: var(--surface); border: 2px solid var(--accent); }

.toast { position: fixed; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); inset-inline: 0; margin: 0 auto; width: max-content; max-width: calc(100% - 32px); background: var(--fg); color: var(--bg); padding: 10px 16px; border-radius: 10px; z-index: 30; font-size: 14px; }
.skeleton { padding: 40px 0; text-align: center; color: var(--muted); }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
.navi.out { margin-top: auto; }
.drawer-who .who { color: var(--fg); font-weight: 600; }
.mrow { display: grid; gap: 8px; }
</style>
</head>

  <header class="top"><div class="wrap top-in" id="top">
    <div class="brandx"><span class="markx"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 8l-9-5-9 5v8l9 5 9-5z"/><path d="M3 8l9 5 9-5M12 13v8"/></svg></span><div><div class="b1">מלאי חטיבתי</div><div class="b2">טוען…</div></div></div>

</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>

<script src="seed.js"></script>
<script>
(() => {
const COLS = ['nodes', 'skus', 'tz', 'stock', 'moves', 'confirms', 'incidents', 'kits', 'loans', 'members'];
const S = {}; COLS.forEach(c => S[c] = {});
const loaded = new Set();
let db = null, busy = false;
const ui = { veh: { number: '', vtype: '' }, vehAdd: {}, kitPick: { kit: '', n: '1' }, tekEdit: false, tekDraft: {}, cat: { kind: 'logat', names: '', unit: '', lines: '' }, catName: {}, catDel: null, tab: 'overview', acting: null, stockUnit: null, stockSub: true, stockQ: '', stockKind: 'all', detail: null, noteFor: null, notes: {}, signer: {}, cryptoDraft: {}, addS: { role: '', name: '', pn: '' }, addR: { name: '', person: '' }, addP: { name: '', unit: '' }, addM: { email: '', name: '', roleTitle: '', pn: '', unit: '', canSign: true, isAdmin: false, canReceive: false }, permUnit: null, report: null, recv: {}, kitAdd: {}, newKit: { sku: '', name: '' }, perDraft: {}, freeQ: '', repQ: '', repUnit: null, repF: 'all', descsLevel: null, loan: { from: '', due: '', kind: 'tz', sku: '', qty: '', tzList: '', newName: '', note: '' } };
let draft = { type: null, target: '', lines: [], tz: [], note: '', kit: {}, kits: [], veh: [] };
const rcv = { kind: 'logat', sku: '', qty: '', tzList: '', newName: '' };
try { ui.acting = localStorage.getItem('inv.acting'); ui.tab = localStorage.getItem('inv.tab') || 'overview'; } catch (e) {}

const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const pad = n => String(n).padStart(2, '0');
const isoD = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const weekStart = (d = new Date()) => { const x = new Date(d); x.setHours(0, 0, 0, 0); x.setDate(x.getDate() - x.getDay()); return isoD(x); };
const WEEK = weekStart();
const weekEnd = () => { const d = new Date(WEEK + 'T00:00:00'); d.setDate(d.getDate() + 6); return d; };
const phase = () => { const n = new Date(), d = n.getDay(), h = n.getHours(); if (d >= 4) return 'escalated'; if (d > 2 || (d === 2 && h >= 12)) return 'overdue'; return 'open'; };
const fmtD = s => { if (!s) return '—'; const d = new Date(s); return `${pad(d.getDate())}.${pad(d.getMonth() + 1)}.${String(d.getFullYear()).slice(2)}`; };
const fmtDT = s => { if (!s) return '—'; const d = new Date(s); return `${fmtD(s)} ${pad(d.getHours())}:${pad(d.getMinutes())}`; };
const now = () => new Date().toISOString();
const uid = p => p + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);

const LEVEL = { brigade: 'חטיבה', battalion: 'יחידה', company: 'פלוגה / חפ״ק', role: 'בעל תפקיד', vehicle: 'רכב' };
const MTYPE = { install: 'התקנה ברכב', uninstall: 'פירוק מרכב', receive: 'קליטה', issue: 'ניפוק', return: 'זיכוי', transfer: 'העברה', loan: 'השאלה מיחידה', loanret: 'החזרת השאלה' };
const MSTAT = { awaiting: ['ממתין לאישור דרג', 'warn'], pending: ['ממתין לחתימה', 'warn'], signed: ['נחתם', 'good'], rejected: ['נדחה', 'crit'], cancelled: ['בוטל', ''] };
const TZSTAT = { ok: ['תקין', 'good'], repair: ['בתיקון', 'warn'], disabled: ['מושבת', ''], lost: ['אבד', 'crit'] };
const ANS = { here: ['נמצא אצלי', 'good'], missing: ['לא נמצא', 'crit'], repair: ['בתיקון / הועבר', 'warn'] };
const INC = { open: ['פתוח', 'crit'], investigating: ['בבירור', 'warn'], found: ['נמצא', 'good'], lost: ['דווח כאובדן', 'crit'] };
const INCTYPE = { missing: 'פריט צ׳ סומן "לא נמצא"', unconfirmed: 'לא התקבל אישור שבועי', count: 'פער בספירה', kit: 'חוסר בתכולת קיט' };

const nodesArr = () => Object.values(S.nodes);
const isVeh = id => S.nodes[id]?.level === 'vehicle';
const atUnit = h => isVeh(h) ? S.nodes[h].parent : h;

    const btn = ph === 'escalated' && !hasInc && h !== id ? `<button class="btn sm crit" data-act="openUnc" data-v="${esc(h)}">פתח חריג</button>` : hasInc ? '<span class="pill crit">נפתח חריג</span>' : '';

  const recent = Object.values(S.moves).filter(m => sc.has(m.to) || sc.has(m.from)).sort((a, b) => (b.createdAt || '').localeCompare(a.createdAt || '')).slice(0, 5);
  const isRoot = !n.parent;
  const loansDue = isRoot ? Object.values(S.loans).filter(l => l.status === 'active' && daysTo(l.due) <= 7).sort((a, b) => a.due.localeCompare(b.due)) : [];
  const perBad = tzs.map(t => [t, periodState(t)]).filter(([, st]) => !st[2]).sort((a, b) => (a[1][1] === 'crit' ? 0 : 1) - (b[1][1] === 'crit' ? 0 : 1));
  const we = weekEnd();
  return `
  <div class="demo">אין להזין למערכת מידע מסווג ללא אישור אבטחת מידע של היחידה.</div>
  <div class="scope">תחום התצוגה: <b>${esc(nm(id))}</b>${where(id) ? ' · ' + esc(where(id)) : ''}</div>

    <div class="stat"><span class="k">לוג״ת בתחום</span><span class="v">${logatQty}<small> · ${skuCount} מק״טים</small></span></div>
    <div class="stat"><span class="k">ממתין לפעולתך · חריגים</span><span class="v">${c.toSign}<small> · ${c.inc} חריגים</small></span></div>

    <div class="tablewrap"><table><thead><tr><th>${colName}</th><th>לוג״ת (יח׳)</th><th>פריטי צ׳</th><th>אישור שבועי</th></tr></thead><tbody>${rows}</tbody></table></div></section>` : ''}
  <section class="block"><h2>טרם אישרו את השבוע<small>שבוע ${fmtD(WEEK + 'T00:00:00')}–${fmtD(we)} · תזכורת ג׳ 12:00 · הסלמה ה׳</small></h2>

  <section class="block"><h2>תקופות הצפנה<small>${tzs.length - perBad.length} מתוך ${tzs.length} פריטי צ׳ בתוקף</small></h2>
    ${perBad.length ? `<div class="list">${perBad.slice(0, 12).map(([t, st]) => `<div class="item ${st[1] === 'crit' ? 'sev-crit' : 'sev-warn'}"><div class="head"><div><div class="title">${tzNo(t.id)} <span class="small muted">${esc(skuName(t.sku))}</span></div><div class="meta">${esc(fullName(t.holder))}</div></div>${pill(st)}</div><div class="actions"><button class="btn sm" data-act="detail" data-v="${esc(t.id)}">עדכון תקופה</button></div></div>`).join('')}${perBad.length > 12 ? `<div class="small muted">ועוד ${perBad.length - 12} פריטים. הרשימה המלאה בדוח צ׳.</div>` : ''}</div>` : empty('לכל פריטי הצ׳ בתחום יש תקופת הצפנה בתוקף', '')}</section>
  ${loansDue.length ? `<section class="block"><h2>השאלות שמועד החזרתן קרוב</h2><div class="list">${loansDue.map(l => `<div class="item ${daysTo(l.due) < 0 ? 'sev-crit' : 'sev-warn'}"><div class="head"><div><div class="title">מ${esc(l.from)}</div><div class="meta">${loanSummary(l)}</div></div>${pill(loanDueState(l))}</div><div class="actions"><button class="btn sm" data-act="tab" data-v="loans">לעמוד ההשאלות</button></div></div>`).join('')}</div></section>` : ''}
  <section class="block"><h2>חריגים</h2>${renderIncidents()}</section>
  <section class="block"><h2>תנועות אחרונות</h2>${recent.length ? `<div class="list">${recent.map(m => moveItem(m)).join('')}</div>` : empty('אין עדיין תנועות בתחום', 'ניפוק, זיכוי והעברה נעשים בעמוד "קבלות".')}</section>`;
}

/* ---------- tz detail sheet ---------- */

    <dl class="kv"><dt>שם מכשיר</dt><dd>${esc(skuName(t.sku))}</dd><dt>צ׳</dt><dd>${tzNo(t.id)}</dd><dt>מס׳ סידורי</dt><dd class="mono" dir="ltr" style="text-align:right">${esc(t.serial || '—')}</dd>
      <dt>שייכות</dt><dd>${ownerCell(t)}${t.loanId && S.loans[t.loanId] ? `<div class="small muted">להחזרה עד ${fmtD(S.loans[t.loanId].due + 'T00:00:00')}</div>` : ''}</dd>
      <dt>מוחתם ל</dt><dd>${signedTo(t) ? esc(fullName(t.holder)) : 'לא מוחתם · במחסן ' + esc(nm(t.holder))}</dd><dt>מאז</dt><dd>${fmtD(t.since)}</dd>
      <dt>מצב</dt><dd>${canEdit ? `<select id="tzStatus" data-act-change="tzStatus" data-v="${esc(t.id)}">${Object.entries(TZSTAT).map(([k, [l]]) => `<option value="${k}" ${t.status === k ? 'selected' : ''}>${l}</option>`).join('')}</select>` : pill(TZSTAT[t.status] || [t.status])}</dd></dl>
    ${periodBlock(t, canEdit || t.holder === me())}

    <div><div class="lbl" style="margin-bottom:6px">היסטוריית תנועות</div>${hist.length ? `<div class="timeline">${hist.map(m => `<div>${fmtD(m.createdAt)} · ${MTYPE[m.type]}: ${esc(sideName(m.from, m.fromExt))} ← ${esc(sideName(m.to, m.toExt))} ${pill(MSTAT[m.status])}</div>`).join('')}</div>` : '<div class="muted small">אין תנועות.</div>'}</div>

}

const bundleKits = () => Object.values(S.kits).filter(k => !k.sku && (k.items || []).some(c => c.sku && S.skus[c.sku])).sort((a, b) => a.name.localeCompare(b.name, 'he'));
function renderKitPicks() {
  const blocks = [];
  draft.tz.forEach(t => { const it = S.tz[t]; if (!it) return; const d = kitDraft(t, it.sku, it.kit && it.kit.items); if (d) blocks.push([t, `${tzNo(t)} ${esc(skuName(it.sku))}`, d, 1]); });
  draft.lines.forEach(l => { if (!l.sku) return; const d = kitDraft('L:' + l.sku, l.sku, null); if (d) blocks.push(['L:' + l.sku, esc(skuName(l.sku)), d, parseInt(l.qty, 10) || 0]); });

}

/* ---------- signing report ---------- */
function reportKeys(m) {
  const out = [];
  (m.lines || []).forEach(l => out.push({ key: 'L:' + l.sku, title: `${esc(skuName(l.sku))} × <span class="num">${l.qty}</span>`, kit: (m.kit || {})['L:' + l.sku] }));
  (m.tz || []).forEach(t => out.push({ key: t, title: `${tzNo(t)} ${esc(skuName(S.tz[t]?.sku))}`, kit: (m.kit || {})[t] }));
  return out;
}
function recvState(m, key) {
  ui.recv[m.id] = ui.recv[m.id] || {};
  if (!ui.recv[m.id][key]) ui.recv[m.id][key] = ((m.kit || {})[key] || []).map(c => ({ ...c, got: !!c.inc }));
  return ui.recv[m.id][key];
}
function renderReport(m) {
  const signing = m.status === 'pending' && m.to === me();
  const keys = reportKeys(m);
  const vehHtml = (m.veh || []).map(v => { const it = (m.vehItems || {})[v] || { tz: [], logat: [] }; const nd = S.nodes[v]; return `<div class="item"><div class="title">רכב <span class="num">${esc(nd?.number || v)}</span> · ${esc(nd?.vtype || '')}</div><div class="small">ציוד מותקן שעובר עם הרכב: ${[...it.tz.map(t => `${esc(skuName(S.tz[t]?.sku))} ${tzNo(t)}`), ...it.logat.map(x => `${esc(skuName(x.sku))} × ${x.qty}`)].join(' · ') || 'אין'}</div></div>`; }).join('');
  const rowsHtml = keys.map(k => {
    const kit = k.kit || [];
    const recv = signing ? recvState(m, k.key) : ((m.kitRecv || {})[k.key] || null);
    return `<div class="item"><div class="title">${k.title}</div>
      ${kit.length ? `<div class="tablewrap" style="border:0"><table><thead><tr><th>אמצעי בקיט</th><th>כמות</th><th>נשלח</th><th>התקבל</th></tr></thead><tbody>${kit.map((c, i) => {
        const r = recv && recv[i];
        const got = signing ? `<input type="checkbox" id="rc_${safeId(k.key)}_${safeId(c.id)}" data-act="recvInc" data-v="${esc(m.id)}|${esc(k.key)}|${i}" ${r && r.got ? 'checked' : ''} aria-label="התקבל ${esc(c.name)}">` : r ? (r.got ? '<span class="pill good">כן</span>' : '<span class="pill crit">לא</span>') : '<span class="muted small">—</span>';
        return `<tr><td>${esc(c.name)}</td><td class="num">${c.qty}</td><td>${c.inc ? '<span class="pill good">כן</span>' : '<span class="pill">לא</span>'}</td><td>${got}</td></tr>`;
      }).join('')}</tbody></table></div>` : '<div class="small muted">פריט ללא קיט</div>'}</div>`;
  }).join('');
  const n = S.nodes[me()];
  const signerSel = signing ? signerBar() : '';
  return `<div class="sheet-bg" data-act="closeSheet" data-v="bg"><div class="sheet" role="dialog" aria-modal="true" aria-label="דוח החתמה">
    <div style="display:flex;justify-content:space-between;gap:10px;align-items:center"><h2 style="font-size:18px">דוח החתמה · ${MTYPE[m.type] || m.type}</h2><button class="btn sm" data-act="closeSheet">סגירה</button></div>
    <dl class="kv"><dt>מוסר</dt><dd>${m.from ? esc(fullName(m.from)) : esc(m.fromExt || 'ספק / מחסן חיצוני')}</dd><dt>מקבל</dt><dd>${m.to ? esc(fullName(m.to)) : esc(m.toExt || 'גורם חיצוני')}</dd><dt>נשלח</dt><dd>${fmtDT(m.createdAt)}${m.createdBy ? ' · ' + esc(m.createdBy) : ''}</dd>

      ${(m.kits || []).length ? `<dt>קיטים</dt><dd>${m.kits.map(k => esc(k.name) + ' × ' + k.count).join(', ')}</dd>` : ''}${m.note ? `<dt>הערה</dt><dd>${esc(m.note)}</dd>` : ''}</dl>
    ${m.kitShort ? `<div class="item sev-crit"><div class="small">בקבלה חסרו ${m.kitShort} אמצעים מתוך מה שנשלח. נפתח אירוע חריג.</div></div>` : ''}
    <div class="list">${vehHtml}${rowsHtml}</div>
    ${signing ? `<div class="card formgrid">${signerSel}<div class="small muted">סמן כל אמצעי שהתקבל בפועל. אמצעי שנשלח ולא סומן ייפתח כחוסר.</div><div class="actions"><button class="btn primary" data-act="sign" data-v="${esc(m.id)}">חתימה על הדוח וקבלת הציוד</button><button class="btn crit" data-act="reject" data-v="${esc(m.id)}">דחייה</button></div></div>` : ''}
  </div></div>`;
}

/* ---------- catalog ---------- */
const canCatalog = () => isOwner() || isBrigadeAdmin() || !!(ME.member && ME.member.active && ME.member.canReceive && ME.member.level === 'brigade');
const skuUse = id => ({ qty: Object.values(S.stock).filter(x => x.sku === id).reduce((a, x) => a + (x.qty || 0), 0), tz: liveTz().filter(t => t.sku === id).length, kit: !!kitFor(id) || Object.values(S.kits).some(k => (k.items || []).some(c => c.sku === id)) });

  if (!canCatalog()) return empty('אין לך הרשאה לקטלוג', 'הקטלוג פתוח לבעל המערכת, למנהלי הרשאות חטיבתיים ולמורשי קליטת אמצעים.');

  };

  const logat = Object.values(S.skus).filter(x => x.kind !== 'tz').sort((a, b) => a.name.localeCompare(b.name, 'he'));

  ${sec('logat', 'לוג״ת')}
  ${sec('tz', 'סוגי צ׳ (מצפינים ומכשירים)')}
  ${edit ? `<section class="block"><h2>הוספת פריטים לקטלוג<small>שורה לכל פריט</small></h2><div class="card formgrid">
    <div class="toolbar"><div class="field" style="flex:0 1 200px"><label for="catKind">סוג</label><select id="catKind" data-bind="cat.kind"><option value="logat" ${c.kind === 'logat' ? 'selected' : ''}>לוג״ת</option><option value="tz" ${c.kind === 'tz' ? 'selected' : ''}>צ׳</option></select></div></div>
    <div class="field"><label for="catNames">שמות הפריטים</label><textarea id="catNames" rows="6" data-bind="cat.names" placeholder="אפוד קרמי&#10;משקפת לילה&#10;ג׳ריקן 20 ל׳">${esc(c.names)}</textarea></div>
    <div class="actions"><button class="btn primary" data-act="catAdd">הוספה לקטלוג</button></div></div></section>
  <section class="block"><h2>הזנת מלאי לוג״ת קיים<small>מלאי פתיחה</small></h2><div class="card formgrid">
    <div class="small muted">לציוד שכבר נמצא אצלכם. שורה לכל פריט: <b>שם, כמות</b>. פריט שלא קיים בקטלוג נוסף אליו אוטומטית. הכמות נוספת למה שכבר רשום ביחידה, ונשמרת קבלה מסוג ״מלאי פתיחה״. פריטי צ׳ מזינים בקליטה, עם מספרי הצ׳.</div>

    <div class="actions"><button class="btn primary" data-act="catOpen">הזנת המלאי</button></div></div></section>` : ''}`;
}

/* ---------- vehicles ---------- */
const vehTz = v => liveTz().filter(t => t.holder === v).sort((a, b) => skuName(a.sku).localeCompare(skuName(b.sku), 'he') || a.id.localeCompare(b.id));
const vehContents = v => [...vehTz(v).map(t => `${esc(skuName(t.sku))} ${tzNo(t.id)}`), ...holdings(v).map(x => `${esc(skuName(x.sku))} × <span class="num">${x.qty}</span>`)];
function renderVehicles() {
  const id = me(), scope = new Set(descU(id));
  const list = nodesArr().filter(v => v.level === 'vehicle' && scope.has(v.parent)).sort((a, b) => (a.number || '').localeCompare(b.number || '', 'he'));
  const canAct = !!currentSigner(false);
  const types = [...new Set(nodesArr().filter(v => v.level === 'vehicle').map(v => v.vtype).filter(Boolean))].sort((a, b) => a.localeCompare(b, 'he'));
  const myTz = liveTz().filter(t => t.holder === id && !t.pending && activeTz(t)).sort((a, b) => skuName(a.sku).localeCompare(skuName(b.sku), 'he') || a.id.localeCompare(b.id));
  const myLogat = holdings(id).filter(x => S.skus[x.sku]?.kind !== 'tz' && avail(id, x.sku) > 0);
  const card = v => {
    const here = v.parent === id, edit = here && canAct && !v.pending, a = ui.vehAdd[v.id] || {};
    const tzs = vehTz(v.id), lg = holdings(v.id);
    return `<div class="card formgrid"><div style="display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:flex-start"><div><h3 style="font-size:16px"><span class="num">${esc(v.number)}</span> · ${esc(v.vtype || 'רכב')}</h3><div class="small muted">${here ? 'במחסן של ' + esc(nm(id)) : 'מוחתם ל' + esc(nm(v.parent))}${v.pending ? ' · <span class="pill warn">בתנועה</span>' : ''}</div></div>${edit && !tzs.length && !lg.length ? `<button class="btn sm crit" data-act="vehDel" data-v="${esc(v.id)}">מחיקת רכב</button>` : ''}</div>
      ${tzs.length || lg.length ? `<div class="tablewrap"><table><thead><tr><th>ציוד מותקן</th><th>צ׳ / כמות</th>${edit ? '<th></th>' : ''}</tr></thead><tbody>${tzs.map(t => `<tr><td>${esc(skuName(t.sku))}</td><td>${tzNo(t.id)}</td>${edit ? `<td><button class="btn sm" data-act="vehOut" data-v="${esc(v.id)}|tz|${esc(t.id)}">פירוק</button></td>` : ''}</tr>`).join('')}${lg.map(x => `<tr><td>${esc(skuName(x.sku))}</td><td class="num">${x.qty}</td>${edit ? `<td><button class="btn sm" data-act="vehOut" data-v="${esc(v.id)}|L|${esc(x.sku)}">פירוק</button></td>` : ''}</tr>`).join('')}</tbody></table></div>` : '<div class="small muted">אין ציוד מותקן.</div>'}
      ${edit ? `<div class="toolbar"><div class="field"><label for="vi_${safeId(v.id)}">התקנת ציוד מהמחסן</label><select id="vi_${safeId(v.id)}" data-bind="vehAdd.${esc(v.id)}.item"><option value="">בחר…</option>${myTz.length ? `<optgroup label="צ׳">${myTz.map(t => `<option value="tz|${esc(t.id)}" ${a.item === 'tz|' + t.id ? 'selected' : ''}>${esc(skuName(t.sku))} · ${esc(t.id)}</option>`).join('')}</optgroup>` : ''}${myLogat.length ? `<optgroup label="לוג״ת">${myLogat.map(x => `<option value="L|${esc(x.sku)}" ${a.item === 'L|' + x.sku ? 'selected' : ''}>${esc(skuName(x.sku))} (זמין ${avail(id, x.sku)})</option>`).join('')}</optgroup>` : ''}</select></div>${a.item && a.item.startsWith('L|') ? `<div class="field" style="flex:0 1 100px"><label for="vq_${safeId(v.id)}">כמות</label><input type="number" min="1" id="vq_${safeId(v.id)}" data-bind="vehAdd.${esc(v.id)}.qty" value="${esc(a.qty || '1')}"></div>` : ''}</div><div class="actions"><button class="btn sm primary" data-act="vehIn" data-v="${esc(v.id)}">התקנה ברכב</button></div>` : ''}
    </div>`;
  };
  return `<div class="scope">רכב נחתם לפי מספר רכב, וכל הציוד שמותקן עליו עובר איתו. מחתימים רכב ליחידה אחרת בעמוד <b>קבלות</b>, כמו כל ציוד. ציוד מתקינים ומפרקים רק כשהרכב נמצא במחסן שלך.</div>
  ${list.length ? `<div class="list">${list.map(card).join('')}</div>` : empty('אין רכבים', canAct ? 'מוסיפים רכב בטופס למטה.' : '')}
  ${canAct && ['brigade', 'battalion'].includes(S.nodes[id].level) ? `<section class="block"><h2>רכב חדש</h2><div class="card formgrid"><div class="toolbar">
    <div class="field"><label for="vNum">מספר רכב</label><input type="text" id="vNum" dir="ltr" data-bind="veh.number" value="${esc(ui.veh.number)}" placeholder="למשל 123-456"></div>
    <div class="field"><label for="vType">סוג רכב</label><input type="text" id="vType" list="vTypes" data-bind="veh.vtype" value="${esc(ui.veh.vtype)}" placeholder="למשל: האמר, סופה, נגמ״ש"><datalist id="vTypes">${types.map(t => `<option value="${esc(t)}">`).join('')}</datalist></div>
  </div><div class="actions"><button class="btn primary" data-act="vehNew">הוספת רכב</button></div></div></section>` : ''}`;
}

/* ---------- kits ---------- */
function renderKits() {
  const root = rootNode(), canEdit = isBrigadeAdmin() && me() === root.id;
  const kits = Object.values(S.kits).sort((a, b) => (a.name || '').localeCompare(b.name || '', 'he'));
  const free = Object.values(S.skus).filter(x => !kitFor(x.id)).sort((a, b) => a.name.localeCompare(b.name, 'he'));
  const count = sku => liveTz().filter(t => t.sku === sku && activeTz(t)).length;
  const cards = kits.map(k => {
    const a = ui.kitAdd[k.id] || {};
    return `<div class="card formgrid"><div style="display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:flex-start"><div><h3 style="font-size:16px">${esc(k.name)}</h3><div class="small muted">${k.sku ? `קיט ישן שמצורף אוטומטית לכל ${esc(skuName(k.sku))}` : `${(k.items || []).length} אמצעים · מנפקים אותו כחבילה בעמוד הקבלות`}</div></div>${canEdit ? `<button class="btn sm crit" data-act="delKit" data-v="${esc(k.id)}">מחיקת קיט</button>` : ''}</div>
      ${(k.items || []).length ? `<div class="tablewrap"><table><thead><tr><th>אמצעי</th><th>כמות בקיט</th>${canEdit ? '<th></th>' : ''}</tr></thead><tbody>${k.items.map(c => `<tr><td>${esc(c.sku ? skuName(c.sku) : c.name)}${c.sku ? '' : ' <span class="pill warn">לא מהקטלוג</span>'}</td><td class="num">${c.qty}</td>${canEdit ? `<td><button class="btn sm" data-act="delComp" data-v="${esc(k.id)}|${esc(c.id)}">הסרה</button></td>` : ''}</tr>`).join('')}</tbody></table></div>` : '<div class="small muted">עדיין אין אמצעים בקיט.</div>'}
      ${canEdit ? `<div class="toolbar"><div class="field"><label for="kcn_${safeId(k.id)}">אמצעי נוסף מהקטלוג</label><select id="kcn_${safeId(k.id)}" data-bind="kitAdd.${esc(k.id)}.sku"><option value="">בחר…</option>${[['tz', 'צ׳'], ['logat', 'לוג״ת']].map(([kind, lbl]) => { const opts = Object.values(S.skus).filter(x => (kind === 'tz') === (x.kind === 'tz') && x.id !== k.sku && !(k.items || []).some(c => c.sku === x.id)).sort((x, y) => x.name.localeCompare(y.name, 'he')); return opts.length ? `<optgroup label="${lbl}">${opts.map(x => `<option value="${esc(x.id)}" ${a.sku === x.id ? 'selected' : ''}>${esc(x.name)}</option>`).join('')}</optgroup>` : ''; }).join('')}</select></div><div class="field" style="flex:0 1 100px"><label for="kcq_${safeId(k.id)}">כמות</label><input type="number" min="1" id="kcq_${safeId(k.id)}" data-bind="kitAdd.${esc(k.id)}.qty" value="${esc(a.qty || '1')}"></div></div><div class="actions"><button class="btn sm" data-act="addComp" data-v="${esc(k.id)}">הוספה לקיט</button></div>` : ''}
    </div>`;
  }).join('');
  return `<div class="scope">קיט הוא חבילה של פריטים מהקטלוג, למשל ״ערכת 710״: מכשיר 710, סוללות ואנטנה. בעמוד הקבלות בוחרים קיט וכמות, והמערכת מוסיפה לניפוק את כל הפריטים שבו. בדוח ההחתמה מצוין איזה קיט נופק.</div>
  ${kits.length ? `<div class="list">${cards}</div>` : empty('עדיין לא הוגדרו קיטים', canEdit ? 'צור קיט חדש למטה.' : 'קיטים מגדירים בעמוד הקיטים של החטיבה.')}
  ${canEdit ? `<section class="block"><h2>קיט חדש</h2><div class="card formgrid"><div class="toolbar">
    
    <div class="field"><label for="nkName">שם הקיט</label><input type="text" id="nkName" data-bind="newKit.name" value="${esc(ui.newKit.name)}" placeholder="למשל: ערכת 710 מלאה"></div>
  </div><div class="actions"><button class="btn primary" data-act="addKit">יצירת קיט</button></div></div></section>` : '<div class="small muted">רק החטיבה יכולה להגדיר ולערוך קיטים.</div>'}`;
}

/* ---------- moves ---------- */
function allowedTypes() {
  const n = S.nodes[me()];
  const t = [];
  if (kids(me()).length) t.push('issue');
  if (n.parent) t.push('return');
  if (n.parent && kids(n.parent).some(k => k.id !== me() && k.level === n.level)) t.push('transfer');
  return t;
}
function targetsFor(type) {
  const n = S.nodes[me()];
  if (type === 'issue') return kids(me()).map(k => k.id);
  if (type === 'return') return [n.parent];
  if (type === 'transfer') return kids(n.parent).filter(k => k.id !== me() && k.level === n.level).map(k => k.id);
  return [];
}
function renderMoves() {
  const id = me(), n = S.nodes[id], sc = new Set(desc(id));
  const types = allowedTypes();
  if (!types.includes(draft.type)) draft.type = types[0] || null;
  const targets = targetsFor(draft.type);
  if (!targets.includes(draft.target)) draft.target = targets.length === 1 ? targets[0] : '';
  const myLogat = holdings(id).filter(s => S.skus[s.sku]?.kind !== 'tz');
  const myTz = liveTz().filter(t => t.holder === id && !t.pending && activeTz(t)).sort((a, b) => a.id.localeCompare(b.id));
  const myVeh = vkids(id).filter(v => !v.pending);

  const lines = draft.lines.map((l, i) => {
    const max = l.sku ? avail(id, l.sku) : 0;
    return `<div class="line"><select id="ln${i}s" data-bind="line.${i}.sku" aria-label="פריט"><option value="">בחר פריט…</option>${myLogat.map(s => `<option value="${esc(s.sku)}" ${l.sku === s.sku ? 'selected' : ''}>${esc(skuName(s.sku))} (זמין ${avail(id, s.sku)})</option>`).join('')}</select>
      <input type="number" id="ln${i}q" data-bind="line.${i}.qty" min="1" ${l.sku ? `max="${max}"` : ''} value="${esc(l.qty)}" aria-label="כמות" placeholder="כמות">
      <button class="btn sm" data-act="delLine" data-v="${i}" aria-label="הסר שורה">הסר</button></div>`;
  }).join('');

  const form = types.length ? `<div class="card formgrid">
    <div class="seg" role="group" aria-label="סוג פעולה">${types.map(t => `<button data-act="dtype" data-v="${t}" aria-pressed="${draft.type === t}">${MTYPE[t]}</button>`).join('')}</div>
    <div class="small muted">${draft.type === 'issue' ? 'ניפוק לדרג שמתחתיך. הציוד עובר רק אחרי שהמקבל חותם.' : draft.type === 'return' ? 'החזרת ציוד לדרג שמעליך. נסגר כשהמקבל מאשר קבלה.' : 'העברה ליחידה מקבילה. דורשת אישור הדרג המשותף ואז חתימת המקבל.'}</div>
    <div class="field"><label for="dTarget">${draft.type === 'return' ? 'מוחזר אל' : 'נמסר אל'}</label><select id="dTarget" data-bind="draft.target"><option value="">בחר…</option>${targets.map(t => `<option value="${esc(t)}" ${draft.target === t ? 'selected' : ''}>${esc(nm(t))}</option>`).join('')}</select></div>
    <div class="field"><span class="lbl">ציוד לוג״ת</span>${myLogat.length ? `${lines}<div><button class="linkbtn" data-act="addLine">+ הוספת פריט לוג״ת</button></div>` : '<span class="small muted">אין עליך ציוד לוג״ת זמין.</span>'}</div>
    ${myVeh.length ? `<div class="field"><span class="lbl">רכבים (${draft.veh.length} נבחרו) · הציוד המותקן עובר יחד עם הרכב</span><div class="checks">${myVeh.map(v => `<label class="check"><input type="checkbox" id="dveh_${safeId(v.id)}" data-act="dveh" data-v="${esc(v.id)}" ${draft.veh.includes(v.id) ? 'checked' : ''}> <span class="num">${esc(v.number)}</span> ${esc(v.vtype || '')} <span class="small muted">${vehContents(v.id).length} פריטים מותקנים</span></label>`).join('')}</div></div>` : ''}
    <div class="field"><span class="lbl">ציוד צ׳ (${draft.tz.length} נבחרו)</span>${myTz.length ? `<div class="checks">${myTz.map(t => `<label class="check"><input type="checkbox" id="dtz_${esc(t.id)}" data-act="dtz" data-v="${esc(t.id)}" ${draft.tz.includes(t.id) ? 'checked' : ''}> ${tzNo(t.id)} <span class="small muted">${esc(skuName(t.sku))}</span></label>`).join('')}</div>` : '<span class="small muted">אין עליך פריטי צ׳ זמינים.</span>'}</div>
    ${bundleKits().length ? `<div class="field"><span class="lbl">ניפוק קיט</span><div class="toolbar"><div class="field"><label for="kpKit">קיט</label><select id="kpKit" data-bind="kitPick.kit"><option value="">בחר קיט…</option>${bundleKits().map(k => `<option value="${esc(k.id)}" ${ui.kitPick.kit === k.id ? 'selected' : ''}>${esc(k.name)}</option>`).join('')}</select></div><div class="field" style="flex:0 1 100px"><label for="kpN">כמות</label><input type="number" min="1" id="kpN" data-bind="kitPick.n" value="${esc(ui.kitPick.n)}"></div></div>${ui.kitPick.kit && S.kits[ui.kitPick.kit] ? `<div class="small muted">כולל: ${S.kits[ui.kitPick.kit].items.filter(c => c.sku).map(c => esc(skuName(c.sku)) + ' × ' + c.qty).join(', ')}</div>` : ''}<div><button class="btn sm" data-act="addKitToDraft">הוספת הקיט לניפוק</button></div>${draft.kits.length ? `<div class="small">קיטים בניפוק: ${draft.kits.map(k => `<span class="pill acc">${esc(k.name)} × ${k.count}</span>`).join(' ')}</div>` : ''}</div>` : ''}
    ${renderKitPicks()}
    <div class="field"><label for="dNote">הערה (לא חובה)</label><input type="text" id="dNote" data-bind="draft.note" value="${esc(draft.note)}"></div>
    <div class="actions"><button class="btn primary" data-act="submitMove">${draft.type === 'transfer' ? 'שליחה לאישור' : 'שליחה לחתימת המקבל'}</button></div>
  </div>` : empty('אין פעולות זמינות לתפקיד זה', '');

  const toSign = Object.values(S.moves).filter(m => m.status === 'pending' && m.to === id);
  const toApprove = Object.values(S.moves).filter(m => m.status === 'awaiting' && m.approver === id);
  const outgoing = Object.values(S.moves).filter(m => openMove(m) && m.from === id);
  const hist = Object.values(S.moves).filter(m => (sc.has(m.to) || sc.has(m.from)) && !openMove(m)).sort((a, b) => (b.createdAt || '').localeCompare(a.createdAt || '')).slice(0, 15);

  const receive = n.level === 'brigade' ? renderReceive() : '';
  return `
  ${signerBar()}
  ${toSign.length || toApprove.length ? `<section class="block"><h2>ממתין לפעולתך</h2><div class="list">
    ${toApprove.map(m => moveItem(m, `<button class="btn primary sm" data-act="approve" data-v="${m.id}">אישור ההעברה</button><button class="btn sm crit" data-act="reject" data-v="${m.id}">דחייה</button>`)).join('')}
    ${toSign.map(m => moveItem(m, `<button class="btn primary sm" data-act="openReport" data-v="${m.id}">פתיחת דוח החתמה וחתימה</button><button class="btn sm crit" data-act="reject" data-v="${m.id}">דחייה</button>`)).join('')}
  </div></section>` : ''}
  <section class="block"><h2>פעולה חדשה<small>פועל בתור ${esc(nm(id))}</small></h2>${form}</section>
  ${receive}
  ${outgoing.length ? `<section class="block"><h2>שלחת וממתין</h2><div class="list">${outgoing.map(m => moveItem(m, `<button class="btn sm" data-act="cancel" data-v="${m.id}">ביטול</button>`)).join('')}</div></section>` : ''}
  <section class="block"><h2>היסטוריה בתחום</h2>${hist.length ? `<div class="list">${hist.map(m => moveItem(m)).join('')}</div>` : empty('אין עדיין תנועות שהסתיימו', '')}</section>`;
}
function renderReceive() {
  const skus = Object.values(S.skus).filter(s => s.kind === rcv.kind).sort((a, b) => a.name.localeCompare(b.name, 'he'));
  const allowed = MEM().filter(x => x.active && x.canReceive);
  const cur = currentSigner(false);
  const ok = cur && cur.s && cur.s.canReceive;
  if (!allowed.length && !isOwner()) return `<section class="block"><h2>קליטת ציוד לחטיבה</h2><div class="item sev-warn"><div class="title">לאף משתמש בחטיבה אין הרשאת קליטת אמצעים</div><div class="small muted">את ההרשאה מגדירים בעמוד ההרשאות של החטיבה.</div><div class="actions"><button class="btn sm" data-act="tab" data-v="unit">לעמוד ההרשאות</button></div></div></section>`;
  return `<section class="block"><h2>קליטת ציוד לחטיבה<small>רק משתמש חטיבתי עם הרשאת קליטת אמצעים יכול לקלוט ציוד מבחוץ</small></h2><div class="card formgrid">
    ${ok ? `<div class="small"><span class="pill good">מורשה קליטה</span> קולט: ${esc(cur.label)}</div>` : `<div class="item sev-warn"><div class="small">${cur ? `ל${esc(cur.label)} אין הרשאת קליטת אמצעים.` : 'אין לך הרשאת חתימה בחטיבה.'} מורשי קליטה: ${allowed.map(x => esc(memberLabel(x))).join(', ')}.</div></div>`}
    <div class="seg" role="group" aria-label="סוג ציוד">${[['logat', 'לוג״ת'], ['tz', 'צ׳']].map(([k, l]) => `<button data-act="rkind" data-v="${k}" aria-pressed="${rcv.kind === k}">${l}</button>`).join('')}</div>
    <div class="field"><label for="rSku">פריט מהקטלוג</label><select id="rSku" data-bind="rcv.sku"><option value="">בחר…</option>${skus.map(s => `<option value="${esc(s.id)}" ${rcv.sku === s.id ? 'selected' : ''}>${esc(s.name)}</option>`).join('')}<option value="__new" ${rcv.sku === '__new' ? 'selected' : ''}>+ פריט חדש לקטלוג</option></select></div>
    ${rcv.sku === '__new' ? `<div class="field"><label for="rNew">שם הפריט החדש</label><input type="text" id="rNew" data-bind="rcv.newName" value="${esc(rcv.newName)}"></div>` : ''}
    ${rcv.kind === 'logat' ? `<div class="field"><label for="rQty">כמות</label><input type="number" id="rQty" min="1" data-bind="rcv.qty" value="${esc(rcv.qty)}"></div>`
      : `<div class="field"><label for="rTz">מספרי צ׳ (שורה לכל פריט, אפשר להוסיף מס׳ סידורי אחרי פסיק)</label><textarea id="rTz" data-bind="rcv.tzList" placeholder="900201, SN-A1">${esc(rcv.tzList)}</textarea></div>`}
    <div class="actions"><button class="btn primary" data-act="receive" ${ok ? '' : 'disabled'}>קליטה למחסן החטיבה</button></div>
  </div></section>`;
}

/* ---------- weekly ---------- */
function renderWeekly() {
  const id = me();
  const mine = liveTz().filter(t => atUnit(t.holder) === id && activeTz(t)).sort((a, b) => a.id.localeCompare(b.id));
  const open = mine.filter(t => !confirmOf(t));
  const ph = phase();
  const we = weekEnd();
  const head = `<div class="card" style="display:grid;gap:6px"><div style="display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center"><b>שבוע ${fmtD(WEEK + 'T00:00:00')}–${fmtD(we)}</b>${open.length ? pill(ph === 'open' ? ['פתוח לאישור', 'acc'] : ph === 'overdue' ? ['באיחור, נשלחה תזכורת', 'warn'] : ['הוסלם לקצין הקשר הגדודי', 'crit']) : pill(['אושר במלואו', 'good'])}</div>
    <div class="small muted">אשר לכל פריט צ׳ שחתום עליך אם הוא נמצא פיזית אצלך. "לא נמצא" פותח מיד אירוע חריג ומדווח לדרג הממונה.</div></div>`;
  if (!mine.length) return head + empty(`אין פריטי צ׳ שחתומים על ${nm(id)}`, 'מי שחתום על צ׳ יראה כאן את הפריטים שלו לאישור. אפשר להחליף "פועל בתור" בראש הדף.');
  const cards = mine.map(t => {
    const c = confirmOf(t);
    const sev = c ? (c.answer === 'here' ? 'sev-good' : c.answer === 'missing' ? 'sev-crit' : 'sev-warn') : '';

/* ---------- equipment descriptor ---------- */
function descCounts(unitId) {
  const sc = new Set(desc(unitId)), out = {};
  const row = k => out[k] = out[k] || { total: 0, wh: 0, down: 0, loan: 0 };
  liveTz().filter(t => sc.has(t.holder) && activeTz(t)).forEach(t => { const r = row(t.sku); r.total++; t.holder === unitId ? r.wh++ : r.down++; if (t.loanId) r.loan++; });
  Object.values(S.stock).filter(x => sc.has(x.holder) && x.qty > 0).forEach(x => { const r = row(x.sku); r.total += x.qty; x.holder === unitId ? r.wh += x.qty : r.down += x.qty; });
  Object.values(S.loans).filter(l => l.status === 'active').forEach(l => (l.lines || []).forEach(li => { if (out[li.sku] && sc.has(rootNode().id)) out[li.sku].loan += li.qty; }));
  return out;
}
const skuOrder = (a, b) => ((S.skus[a]?.kind === 'tz' ? 0 : 1) - (S.skus[b]?.kind === 'tz' ? 0 : 1)) || skuName(a).localeCompare(skuName(b), 'he');
const tekExplicit = (u, k) => { const v = S.skus[k]?.teken?.[u]; return v === undefined || v === null || v === '' ? null : +v; };
function tekenOf(u, k) {
  const e = tekExplicit(u, k); if (e !== null) return e;
  let sum = null; kids(u).filter(c => c.level !== 'role').forEach(c => { const v = tekenOf(c.id, k); if (v !== null) sum = (sum || 0) + v; });
  return sum;
}
const tekKeys = u => { const sc = new Set(desc(u)); return Object.values(S.skus).filter(x => x.teken && Object.keys(x.teken).some(id => sc.has(id) && tekExplicit(id, x.id) !== null)).map(x => x.id); };
const gapCell = (have, tek, bold) => { const h = bold ? `<b>${have}</b>` : have || (tek !== null ? '0' : '<span class="muted">—</span>'); if (tek === null) return `<td class="num">${h}</td>`; const d = have - tek; return `<td class="num">${h}<span class="muted"> / ${tek}</span>${d < 0 ? ` <span class="pill crit">חסר ${-d}</span>` : d > 0 ? ` <span class="pill warn">עודף ${d}</span>` : ' <span class="pill good">מלא</span>'}</td>`; };
function renderDescriptor() {
  const id = me(), cnt = descCounts(id); tekKeys(id).forEach(k => { cnt[k] = cnt[k] || { total: 0, wh: 0, down: 0, loan: 0 }; }); const keys = Object.keys(cnt).sort(skuOrder);
  const row = k => { const r = cnt[k]; return `<tr><td>${esc(skuName(k))}</td>${gapCell(r.total, tekenOf(id, k), true)}<td class="num">${r.wh || '<span class="muted">—</span>'}</td><td class="num">${r.down || '<span class="muted">—</span>'}</td><td class="num">${r.loan || '<span class="muted">—</span>'}</td></tr>`; };
  const tzK = keys.filter(k => S.skus[k]?.kind === 'tz'), lK = keys.filter(k => S.skus[k]?.kind !== 'tz');
  const head = `<thead><tr><th>פריט</th><th>יש / תקן</th><th>במחסן</th><th>מוחתם מטה</th><th>מתוכם בהשאלה</th></tr></thead>`;
  return `<div class="scope">כמה יש ל<b>${esc(nm(id))}</b> מכל סוג ציוד, כולל מה שמוחתם על היחידות ובעלי התפקיד שמתחתיה.</div>
  <section class="block"><h2>מכשירים (צ׳)</h2>${tzK.length ? `<div class="tablewrap"><table>${head}<tbody>${tzK.map(row).join('')}</tbody></table></div>` : empty('אין פריטי צ׳', '')}</section>
  <section class="block"><h2>לוג״ת</h2>${lK.length ? `<div class="tablewrap"><table>${head}<tbody>${lK.map(row).join('')}</tbody></table></div>` : empty('אין לוג״ת', '')}</section>`;
}

/* ---------- brigade descriptors ---------- */
function renderDescs() {
  const root = rootNode().id;
  const levels = [root, ...kids(root).filter(k => k.level !== 'role' && kids(k.id).length).map(k => k.id)];
  if (!levels.includes(ui.descsLevel)) ui.descsLevel = root;
  const lv = ui.descsLevel, editing = ui.tekEdit && canCatalog();

  const ecols = kids(lv).filter(k => k.level !== 'role');
  const totals = descCounts(lv);
  tekKeys(lv).forEach(k => { totals[k] = totals[k] || { total: 0, wh: 0, down: 0, loan: 0 }; });

  const levelSel = `<div class="toolbar"><div class="field"><label for="descsLevel">רמת פירוט</label><select id="descsLevel" data-bind="descsLevel">${levels.map(l => `<option value="${esc(l)}" ${l === lv ? 'selected' : ''}>${l === root ? 'כל יחידות החטיבה' : esc(nm(l)) + ' לפי פלוגות'}</option>`).join('')}</select></div>${canCatalog() ? `<div class="actions">${editing ? '' : '<button class="btn primary" data-act="tekEdit">הזנת תקן</button>'}</div>` : ''}</div>`;
  if (editing) {
    const d = ui.tekDraft;
    const val = (k, u) => d[k] && d[k][u] !== undefined ? d[k][u] : (tekExplicit(u, k) ?? '');
    const esec = (title, kind) => { const ks = Object.values(S.skus).filter(x => (kind === 'tz') === (x.kind === 'tz')).sort((a, b) => a.name.localeCompare(b.name, 'he')).map(x => x.id); return ks.length ? `<section class="block"><h2>${title}</h2><div class="tablewrap"><table><thead><tr><th>פריט</th>${ecols.map(c => `<th>${esc(c.name)}</th>`).join('')}<th>סה״כ ${esc(S.nodes[lv].name)}</th></tr></thead><tbody>${ks.map(k => { const sum = ecols.reduce((a, c) => { const v = val(k, c.id); return a + (v === '' ? (tekenOf(c.id, k) || 0) : +v || 0); }, 0); return `<tr><td>${esc(skuName(k))}</td>${ecols.map(c => `<td><input type="number" min="0" inputmode="numeric" aria-label="תקן ${esc(skuName(k))} ${esc(c.name)}" data-bind="tek.${esc(k)}.${esc(c.id)}" value="${esc(val(k, c.id))}" placeholder="${tekExplicit(c.id, k) === null && tekenOf(c.id, k) !== null ? tekenOf(c.id, k) : ''}" style="width:72px"></td>`).join('')}<td class="num">${sum || '<span class="muted">—</span>'}</td></tr>`; }).join('')}</tbody></table></div></section>` : ''; };
    return `<div class="scope">הזנת תקן: כמה מכל פריט כל יחידה אמורה להחזיק. משאירים ריק כשאין תקן. ${lv === root ? 'כאן מזינים תקן לכל גדוד. כדי להזין לפלוגות, בוחרים גדוד ברמת הפירוט.' : 'כאן מזינים תקן לפלוגות של ' + esc(nm(lv)) + '. תקן הגדוד מחושב מסכום הפלוגות, אלא אם הוזן לו תקן ישירות ברמת החטיבה.'}</div>
    ${levelSel}
    ${esec('מכשירים (צ׳)', 'tz')}${esec('לוג״ת', 'logat')}
    <div class="actions" style="position:sticky;bottom:12px"><button class="btn primary" data-act="tekSave">שמירת התקן</button><button class="btn" data-act="tekCancel">ביטול</button></div>`;
  }
  return `<div class="scope">כמות הציוד מכל סוג בכל יחידה, מול התקן (יש / תקן). בחר רמה כדי לפרק גדוד לפלוגות שלו.</div>
  ${levelSel}
  ${section('מכשירים (צ׳)', keys.filter(k => S.skus[k]?.kind === 'tz'))}

function loanSummary(l) {
  const parts = (l.lines || []).map(x => `${esc(skuName(x.sku))} × ${x.qty}`);

/* ---------- incidents ---------- */
function renderIncidents() {
  const sc = new Set(desc(me()));
  const list = Object.values(S.incidents).filter(i => sc.has(i.holder)).sort((a, b) => {
    const o = s => (s === 'open' ? 0 : s === 'investigating' ? 1 : 2);
    return o(a.status) - o(b.status) || (b.createdAt || '').localeCompare(a.createdAt || '');
  });
  if (!list.length) return empty('אין אירועים חריגים בתחום', 'אירוע נפתח אוטומטית כשפריט צ׳ מסומן "לא נמצא", או ידנית כשאישור שבועי לא התקבל.');
  return `<div class="list">${list.map(i => {
    const closed = i.status === 'found' || i.status === 'lost' && false;
    const sev = i.status === 'open' ? 'sev-crit' : i.status === 'investigating' ? 'sev-warn' : '';
    return `<div class="item ${sev}"><div class="head"><div><div class="title">${esc(INCTYPE[i.type] || i.type)}</div>
      <div class="meta">${esc(fullName(i.holder))} · נפתח ${fmtDT(i.createdAt)}</div></div>${pill(INC[i.status])}</div>
      ${i.tz ? `<div class="small">${tzNo(i.tz)} ${esc(skuName(S.tz[i.tz]?.sku))} <button class="linkbtn" data-act="detail" data-v="${esc(i.tz)}">כרטיס פריט</button></div>` : ''}
      ${i.note ? `<div class="meta">הערה: ${esc(i.note)}</div>` : ''}
      <div class="toolbar"><div class="field" style="flex:0 1 200px"><label for="inc_${esc(i.id)}">סטטוס</label><select id="inc_${esc(i.id)}" data-act-change="incStatus" data-v="${esc(i.id)}">${Object.entries(INC).map(([k, [l]]) => `<option value="${k}" ${i.status === k ? 'selected' : ''}>${l}</option>`).join('')}</select></div></div>
    </div>`; }).join('')}</div>`;
}

/* ---------- structure additions (applied once by the owner or a brigade admin) ---------- */
const STRUCT_ADD = [
  ['hpk-mht', { level: 'battalion', name: 'חפ״ק מח״ט', order: 7, parent: 'b55' }],
  ['hpk-smht', { level: 'battalion', name: 'חפ״ק סמח״ט', order: 8, parent: 'b55' }],
];
let structBusy = false;
function ensureStructure() {
  if (structBusy || !isBrigadeAdmin()) return;
  const missing = STRUCT_ADD.filter(([id, n]) => !S.nodes[id] && S.nodes[n.parent]);
  if (!missing.length) return;
  structBusy = true;
  const b = db.batch(); missing.forEach(([id, n]) => b.set(col('nodes').doc(id), n));
  b.commit().then(() => toast('נוספו למבנה: ' + missing.map(([, n]) => n.name).join(', '))).catch(e => console.error(e)).finally(() => { structBusy = false; });
}

/* ---------- main render ---------- */
function render() {
  const main = document.getElementById('main');
  if (authState !== 'in') { renderGate(); return; }
  if (loaded.size < COLS.length) { gate('<div class="skeleton">טוען את נתוני המלאי…</div>'); return; }
  const root = rootNode();
  if (!root) { gate(isOwner() ? importView() : empty('עדיין אין יחידות במערכת', 'בעל המערכת צריך לבצע ייבוא ראשוני של מבנה החטיבה.')); return; }
  if (!isOwner() && (!ME.member || !ME.member.active || !S.nodes[ME.member.unit])) { authState = 'nomember'; renderGate(); return; }
  ensureStructure();
  const scopeIds = descU(viewRoot());
  if (!scopeIds.includes(ui.acting)) ui.acting = ME.member && scopeIds.includes(ME.member.unit) ? ME.member.unit : scopeIds[0];
  renderHeader();
  const a = document.activeElement, fid = a && a.id, s0 = a && a.selectionStart, s1 = a && a.selectionEnd;
  const views = { overview: renderOverview, free: renderFree, moves: renderMoves, tzrep: renderTzReport, desc: renderDescriptor, loans: renderLoans, descs: renderDescs, unit: renderUnit, kits: renderKits, catalog: renderCatalog, vehicles: renderVehicles };
  main.innerHTML = `<h1 class="ptitle">${esc(ui.pageTitle || '')}</h1>` + (views[ui.tab] || renderOverview)();
  renderSheet();
  if (fid) { const el = document.getElementById(fid); if (el) { el.focus(); try { if (s0 != null) el.setSelectionRange(s0, s1); } catch (e) {} } }
}

/* ---------- actions ---------- */
const H = {
  menu: () => { menuOpen = true; renderDrawer(); },
  menuClose: () => { menuOpen = false; renderDrawer(); },
  tab: v => { menuOpen = false; ui.tab = v; try { localStorage.setItem('inv.tab', v); } catch (e) {} render(); window.scrollTo(0, 0); },
  goto: v => { if (!descU(viewRoot()).includes(v)) return; ui.acting = v; ui.permUnit = null; ui.repUnit = null; ui.repF = 'all'; draft = { type: null, target: '', lines: [], tz: [], note: '', kit: {}, kits: [], veh: [] }; try { localStorage.setItem('inv.acting', v); } catch (e) {} render(); window.scrollTo(0, 0); },
  kind: v => { ui.stockKind = v; render(); },
  permSel: v => { ui.permUnit = v; ui.addM.unit = v; render(); },
  gotoPerm: v => { const owner = permOwner(v); H.goto(owner); ui.permUnit = v; H.tab('unit'); },
  detail: v => { ui.detail = v; renderSheet(); },
  closeSheet: (v, el, e) => { if (v === 'bg' && e.target !== el) return; ui.detail = null; ui.report = null; renderSheet(); },
  dtype: v => { draft.type = v; draft.target = ''; render(); },
  vehNew: () => run(async () => {
    const id = me(); currentSigner();
    if (!['brigade', 'battalion'].includes(S.nodes[id].level)) fail('רכבים מוסיפים בחטיבה או בגדוד.');
    const number = ui.veh.number.trim(), vtype = ui.veh.vtype.trim();
    if (!number) fail('הזן מספר רכב.'); if (!vtype) fail('הזן סוג רכב.');
    const vid = 'v-' + number.replace(/[^0-9A-Za-z]/g, '');
    if (vid === 'v-') fail('מספר רכב צריך להכיל ספרות.');
    if (S.nodes[vid]) fail(`רכב ${number} כבר קיים (${nm(S.nodes[vid].parent)}).`);
    await put('nodes', vid, { level: 'vehicle', name: `${vtype} ${number}`, number, vtype, parent: id, top: topOf(id), order: 0, pending: null, createdAt: now() });
    ui.veh = { number: '', vtype: ui.veh.vtype };
  }, 'הרכב נוסף.'),
  vehDel: v => run(async () => { const n = S.nodes[v]; currentSigner(); if (!n || n.parent !== me()) fail('אפשר למחוק רק רכב שנמצא במחסן שלך.'); if (vehTz(v).length || holdings(v).length) fail('יש ציוד מותקן ברכב. מפרקים אותו קודם.'); await col('nodes').doc(v).delete(); }, 'הרכב נמחק.'),
  vehIn: v => run(async () => {
    const id = me(), n = S.nodes[v], sg = currentSigner(); if (!n || n.parent !== id || n.pending) fail('אפשר להתקין ציוד רק ברכב שנמצא במחסן שלך.');
    const a = ui.vehAdd[v] || {}; if (!a.item) fail('בחר פריט להתקנה.');
    const [kind, ref] = a.item.split('|'); const mid = uid('m');
    if (kind === 'tz') { const t = S.tz[ref]; if (!t || t.holder !== id || t.pending) fail('הפריט לא זמין במחסן.'); await patch('tz', ref, { holder: v, since: now() }); await put('moves', mid, { type: 'install', from: id, to: v, lines: [], tz: [ref], status: 'signed', createdAt: now(), signedAt: now(), signedBy: sg.label, note: '' }); }
    else { const q = parseInt(a.qty || '1', 10); if (!(q > 0)) fail('הזן כמות.'); if (q > avail(id, ref)) fail(`זמין רק ${avail(id, ref)}.`); await addQty(id, ref, -q); await addQty(v, ref, q); await put('moves', mid, { type: 'install', from: id, to: v, lines: [{ sku: ref, qty: q }], tz: [], status: 'signed', createdAt: now(), signedAt: now(), signedBy: sg.label, note: '' }); }
    ui.vehAdd[v] = {};
  }, 'הותקן ברכב.'),
  vehOut: v => run(async () => {
    const [vid, kind, ref] = v.split('|'); const id = me(), n = S.nodes[vid], sg = currentSigner(); if (!n || n.parent !== id || n.pending) fail('אפשר לפרק ציוד רק מרכב שנמצא במחסן שלך.');
    const mid = uid('m');
    if (kind === 'tz') { await patch('tz', ref, { holder: id, since: now() }); await put('moves', mid, { type: 'uninstall', from: vid, to: id, lines: [], tz: [ref], status: 'signed', createdAt: now(), signedAt: now(), signedBy: sg.label, note: '' }); }
    else { const q = qtyOf(vid, ref); await addQty(vid, ref, -q); await addQty(id, ref, q); await put('moves', mid, { type: 'uninstall', from: vid, to: id, lines: [{ sku: ref, qty: q }], tz: [], status: 'signed', createdAt: now(), signedAt: now(), signedBy: sg.label, note: '' }); }
  }, 'פורק מהרכב והוחזר למחסן.'),
  addKitToDraft: () => {
    const k = S.kits[ui.kitPick.kit]; const n = parseInt(ui.kitPick.n, 10);
    if (!k) { toast('בחר קיט.'); return; } if (!(n > 0)) { toast('הזן כמות קיטים, 1 ומעלה.'); return; }
    const id = me(), items = (k.items || []).filter(c => c.sku && S.skus[c.sku]);
    const missing = [], pickTz = [];
    for (const c of items) {
      const need = c.qty * n;
      if (S.skus[c.sku].kind === 'tz') {
        const free = liveTz().filter(t => t.holder === id && !t.pending && activeTz(t) && t.sku === c.sku && !draft.tz.includes(t.id) && !pickTz.includes(t.id)).sort((a, b) => a.id.localeCompare(b.id)).slice(0, need);
        if (free.length < need) missing.push(`${skuName(c.sku)}: חסרים ${need - free.length}`);
        pickTz.push(...free.map(t => t.id));
      } else {
        const inDraft = draft.lines.filter(l => l.sku === c.sku).reduce((a, l) => a + (parseInt(l.qty, 10) || 0), 0);
        if (avail(id, c.sku) < inDraft + need) missing.push(`${skuName(c.sku)}: זמין ${Math.max(0, avail(id, c.sku) - inDraft)} מתוך ${need}`);
      }
    }
    if (missing.length) { toast('אין מספיק ציוד לקיט: ' + missing.join(' · ')); return; }
    for (const c of items) if (S.skus[c.sku].kind !== 'tz') { const l = draft.lines.find(x => x.sku === c.sku); if (l) l.qty = String((parseInt(l.qty, 10) || 0) + c.qty * n); else draft.lines.push({ sku: c.sku, qty: String(c.qty * n) }); }
    draft.tz.push(...pickTz);
    const ex = draft.kits.find(x => x.id === k.id); if (ex) ex.count += n; else draft.kits.push({ id: k.id, name: k.name, count: n });
    ui.kitPick = { kit: '', n: '1' };
    toast(`${k.name} × ${n} נוסף לניפוק${pickTz.length ? `. נבחרו ${pickTz.length} פריטי צ׳, אפשר להחליף בסימון למעלה` : ''}.`); render();
  },
  addLine: () => { draft.lines.push({ sku: '', qty: '' }); render(); },
  delLine: v => { draft.lines.splice(+v, 1); render(); },
  dveh: v => { const i = draft.veh.indexOf(v); if (i < 0) draft.veh.push(v); else draft.veh.splice(i, 1); render(); },
  dtz: v => { const i = draft.tz.indexOf(v); if (i < 0) draft.tz.push(v); else { draft.tz.splice(i, 1); delete draft.kit[v]; } render(); },
  kitInc: v => { const [k, cid] = v.split('|'); const it = (draft.kit[k] || []).find(c => c.id === cid); if (it) it.inc = !it.inc; render(); },
  recvInc: v => { const [mid, k, i] = v.split('|'); const m = S.moves[mid]; if (!m) return; const st = recvState(m, k); if (st[+i]) st[+i].got = !st[+i].got; renderSheet(); },
  openReport: v => { ui.report = v; renderSheet(); },
  addKit: () => run(async () => {
    const name = ui.newKit.name.trim(); if (!name) fail('הזן שם לקיט.'); if (Object.values(S.kits).some(k => k.name === name)) fail('כבר יש קיט בשם הזה.');
    await put('kits', uid('k'), { name, items: [] });
    ui.newKit = { sku: '', name: '' };
  }, 'הקיט נוצר. הוסף לו אמצעים.'),
  addComp: v => run(async () => {
    const a = ui.kitAdd[v] || {}, sku = a.sku, q = parseInt(a.qty || '1', 10);
    if (!sku || !S.skus[sku]) fail('בחר אמצעי מהקטלוג. אם הוא חסר, מוסיפים אותו קודם בעמוד קטלוג ציוד.'); if (!(q > 0)) fail('כמות צריכה להיות 1 ומעלה.');
    if ((S.kits[v].items || []).some(c => c.sku === sku)) fail('האמצעי כבר נמצא בקיט.');
    await patch('kits', v, { items: [...(S.kits[v].items || []), { id: uid('c'), sku, name: skuName(sku), qty: q }] });

async function wipeLogat() {

  Object.entries(S.stock || {}).forEach(([id, r]) => { if (DEMO_LOGAT.includes(r.sku)) refs.push(db.collection('stock').doc(id)); });
  for (let i = 0; i < refs.length; i += 400) { const b = db.batch(); refs.slice(i, i + 400).forEach(r => b.delete(r)); await b.commit(); }
}
async function wipeData() {

}

function subscribe() {

    if (c === 'members') { const m = S.members[ME.email]; ME.member = m || null; if (!isOwner() && (!m || !m.active)) authState = 'nomember'; }

}
